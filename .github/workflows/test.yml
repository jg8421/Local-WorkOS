name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check tracked source and complete public history
        run: python tools/check_public_privacy.py --history
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install full test and export dependencies
        run: python -m pip install -r requirements-development.txt
      - name: Run synthetic unit and HTTP regression tests
        env:
          PYTHONPATH: vendor
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
          WORKOS_MEMORY_ROOT: ''
        run: python -m unittest discover -s tests -v
      - name: Run session recovery transport regressions
        run: |
          node tests/test_api_client.cjs
          node tests/test_ai_controls.cjs
          node tests/test_file_operations.cjs
          node tests/test_startup_reads.cjs
